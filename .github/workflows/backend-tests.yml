name: Backend tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  blender:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install bpy==4.2.0
      - run: python tests/test_backend.py -v
